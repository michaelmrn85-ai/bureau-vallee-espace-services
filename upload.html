<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depot fichiers - Bureau Vallee Montaigu</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="upload-body">
  <main class="upload-shell">
    <section class="upload-card">
      <img class="upload-logo" src="./logo-bureau-vallee-2021.png" alt="Bureau Vallee">
      <p class="eyebrow">Espace Services Montaigu-Vendee</p>
      <h1>Envoyer des fichiers a imprimer</h1>

      <form id="phone-upload-form" class="phone-form">
        <div class="field-group">
          <label for="customer-name">Nom ou repere client</label>
          <input id="customer-name" name="customerName" type="text" maxlength="80" placeholder="Ex : Martin">
        </div>

        <label class="upload-zone upload-zone-phone" for="phone-files">
          <input id="phone-files" name="files" type="file" multiple required accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg">
          <span class="upload-title">Choisir mes fichiers</span>
          <span class="upload-subtitle">PDF, Word, PNG, JPEG</span>
        </label>

        <div class="phone-file-list" id="phone-file-list"></div>
        <button class="primary-btn upload-submit" type="submit">Obtenir mon code</button>
      </form>

      <div class="pickup-result hidden" id="pickup-result">
        <span>Votre code de retrait</span>
        <strong id="pickup-result-code">0000</strong>
        <p>Entrez ce code sur la borne Bureau Vallee pour lancer l'impression.</p>
      </div>

      <p class="upload-note">Les fichiers sont conserves temporairement puis supprimes automatiquement.</p>
    </section>
  </main>

  <script src="./upload.js"></script>
</body>
</html>

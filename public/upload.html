<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload mobile - Bureau Vallee</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="mobile-body">
  <section class="notice-screen hidden" id="notice-screen" aria-live="polite">
    <img src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
    <strong id="notice-screen-message"></strong>
  </section>

  <section class="session-screen hidden" id="session-screen" aria-live="polite">
    <img src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
    <strong id="session-screen-message"></strong>
  </section>

  <main class="mobile-shell">
    <section class="mobile-card">
      <img class="mobile-logo" src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
      <div class="notice-banner hidden" id="notice-banner"></div>
      <p class="eyebrow">Bureau Vallee</p>
      <h1>Envoyer mes fichiers</h1>
      <p class="lead">Ajoutez vos PDF, Word, PNG ou JPEG. Un code vous sera donne pour l'impression.</p>

      <form id="upload-form">
        <label>
          Nom ou repere client
          <input id="customer-name" name="customerName" type="text" maxlength="80" placeholder="Ex : Martin">
        </label>

        <label class="drop-zone">
          <input id="files-input" name="files" type="file" multiple required accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg">
          <span>Choisir mes fichiers</span>
          <small>PDF, Word, PNG, JPEG</small>
        </label>

        <fieldset class="choice-field">
          <legend>Mode d'impression souhaite</legend>
          <label><input type="radio" name="printMode" value="noir-blanc" checked> Noir et blanc</label>
          <label><input type="radio" name="printMode" value="couleur"> Couleur</label>
        </fieldset>

        <div class="selected-files" id="selected-files"></div>
        <button class="wide-btn" type="submit">Envoyer et obtenir mon code</button>
      </form>

      <div class="result hidden" id="result">
        <span>Votre code</span>
        <strong id="result-code">0000</strong>
        <p>Donnez ce code au comptoir pour imprimer vos fichiers.</p>
      </div>
      <p class="message" id="upload-message"></p>
    </section>
  </main>
  <script src="/notice.js"></script>
  <script src="/session.js"></script>
  <script src="/upload.js"></script>
</body>
</html>

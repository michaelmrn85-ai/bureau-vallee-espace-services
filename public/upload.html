<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envoi de fichiers</title>
  <link rel="stylesheet" href="/modern.css?v=20260618-foundation">
</head>
<body data-app="upload">
  <main class="mobile-upload">
    <div class="mobile-card">
      <div class="app-mark">▣</div>
      <p class="eyebrow" id="mobile-greeting">Session d'impression</p>
      <h1>Envoyer vos fichiers</h1>
      <p id="upload-lead">Ajoutez vos documents. Ils apparaîtront automatiquement sur le poste.</p>
      <form id="upload-form">
        <input id="customer-name" name="customerName" type="hidden">
        <label class="file-drop">
          <input id="files-input" name="files" type="file" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic,.heif,.webp">
          <span>+ Ajouter des fichiers</span>
          <small>PDF, Word, PNG, JPEG, HEIC ou WebP</small>
        </label>
        <div id="selected-files" class="selected-files"></div>
        <button class="primary wide" type="submit">Envoyer les fichiers</button>
      </form>
      <p id="upload-message" class="status-line"></p>
      <div id="upload-busy" class="busy hidden">Envoi en cours...</div>
      <div id="result" class="result-card hidden">
        <span>Code dossier</span>
        <strong id="result-code">0000</strong>
        <p id="result-help">Retournez au poste : vos fichiers sont prêts.</p>
      </div>
      <div class="security-note"><span>◇</span><div><strong>Connexion sécurisée</strong><p>Vos fichiers sont supprimés automatiquement après impression.</p></div></div>
    </div>
  </main>
  <script src="/modern-upload.js?v=20260618-foundation"></script>
</body>
</html>

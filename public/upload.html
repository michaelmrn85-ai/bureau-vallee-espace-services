<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envoi de fichiers</title>
  <link rel="stylesheet" href="/modern.css?v=20260620-photo-orientation-usb-eject">
</head>
<body data-page="upload">
  <main class="upload-page">
    <section class="upload-card">
      <img src="/logo-bureau-vallee-2021.png" alt="Bureau Vallée" class="upload-logo">
      <p class="upload-kicker" id="mobile-greeting">Espace Services</p>
      <h1>Envoyer vos documents</h1>
      <p id="upload-lead">Ajoutez vos fichiers. Ils apparaîtront automatiquement sur le poste d'impression.</p>

      <form id="upload-form" class="upload-form">
        <input id="customer-name" name="customerName" type="hidden">
        <label class="upload-drop">
          <input id="files-input" name="files" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.heic,.heif,.webp">
          <span>Ajouter des fichiers</span>
          <small>5 fichiers maximum. PDF, PNG, JPEG, HEIC, WebP ou export Canva PDF/PNG/JPEG.</small>
        </label>
        <div id="selected-files" class="upload-selected"></div>
        <button class="upload-submit" type="submit">Envoyer</button>
      </form>

      <p id="upload-message" class="upload-message"></p>
      <div id="upload-busy" class="upload-busy hidden">
        <div class="hourglass" aria-hidden="true"></div>
        <strong>Envoi en cours...</strong>
        <span>Merci de patienter pendant le transfert des fichiers.</span>
      </div>
      <div id="result" class="upload-result hidden">
        <span>Code dossier</span>
        <strong id="result-code">0000</strong>
        <p id="result-help">Vos fichiers sont transmis au poste.</p>
      </div>
    </section>
  </main>
  <script src="/modern-upload.js?v=20260620-photo-orientation-usb-eject"></script>
</body>
</html>

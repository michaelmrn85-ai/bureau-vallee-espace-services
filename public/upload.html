<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload mobile - Bureau Vallee</title>
  <link rel="stylesheet" href="/styles.css?v=20260608-admin-upload">
</head>
<body class="mobile-body">
  <section class="notice-screen hidden" id="notice-screen" aria-live="polite">
    <img src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
    <strong id="notice-screen-message"></strong>
  </section>

  <main class="mobile-shell">
    <section class="mobile-card">
      <img class="mobile-logo" src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
      <div class="notice-banner hidden" id="notice-banner"></div>
      <p class="eyebrow">Bureau Vallee</p>
      <h1>Envoyer mes fichiers</h1>
      <p class="lead" id="upload-lead">Ajoutez vos PDF, PNG, JPG, JPEG ou HEIC jusqu'a 500 Mo par fichier. Les fichiers Word sont a presenter au comptoir.</p>

      <form id="upload-form">
        <label>
          Nom ou repere client
          <input id="customer-name" name="customerName" type="text" maxlength="80" placeholder="Ex : Martin">
        </label>

        <label class="drop-zone">
          <input id="files-input" name="files" type="file" multiple required accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic,.heif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,image/heic,image/heif">
          <span>Choisir et envoyer mes fichiers</span>
          <small>Le code s'affiche automatiquement apres selection. Limite : 500 Mo par fichier.</small>
        </label>

        <div class="selected-files" id="selected-files"></div>
        <div class="busy-state hidden" id="upload-busy" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <strong>Merci de patienter</strong>
        </div>
      </form>

      <div class="result hidden" id="result">
        <span>Votre code</span>
        <strong id="result-code">0000</strong>
        <p id="result-help">Saisissez ce code sur le poste face a vous, pas au comptoir.</p>
      </div>
      <p class="message" id="upload-message"></p>
    </section>
  </main>
  <script src="/notice.js?v=20260523-print-preview"></script>
  <script src="/upload.js?v=20260608-admin-upload"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord</title>
  <link rel="stylesheet" href="/modern.css?v=20260716-mailbox-flow">
</head>
<body data-page="admin">
  <main class="admin-page mailbox-admin-page">
    <header class="simple-admin-header admin-header-clean mailbox-admin-header">
      <div>
        <p>Administration</p>
        <h1>Boîte de fichiers</h1>
        <small id="dashboard-updated">Fichiers reçus par mail et QR code</small>
      </div>
      <div class="admin-header-actions">
        <div class="admin-header-buttons">
          <button id="refresh-admin" type="button">Actualiser</button>
          <button class="danger-action top-danger-action" type="button" data-shutdown-station="poste-1">Extinction Poste 1</button>
          <button class="danger-action top-danger-action" type="button" data-shutdown-station="poste-2">Extinction Poste 2</button>
        </div>
        <p class="admin-action-status" id="admin-action-status"></p>
      </div>
    </header>

    <section class="file-mailbox-shell">
      <aside class="file-mailbox-sidebar">
        <button class="active" type="button" data-admin-tab="mail">Fichiers mail <span id="mail-count">0</span></button>
        <button type="button" data-admin-tab="qr">Fichiers QR code <span id="qr-count">0</span></button>
        <div class="counter-qr-mini">
          <strong>QR comptoir</strong>
          <img id="counter-qr" src="/qr.gif?mode=admin&source=comptoir" alt="QR code comptoir">
          <input id="counter-upload-url" readonly value="/upload?mode=admin&source=comptoir">
          <button id="copy-counter-url" type="button">Copier le lien</button>
        </div>
      </aside>

      <section class="file-mailbox-content">
        <div class="mailbox-toolbar">
          <h2 id="mailbox-title">Fichiers mail</h2>
          <p id="mailbox-subtitle">Sélectionnez un envoi pour consulter et télécharger les fichiers.</p>
        </div>
        <div class="file-mailbox-layout">
          <div class="file-message-list" id="file-message-list"></div>
          <article class="file-message-detail" id="file-message-detail">
            <p class="admin-empty-files">Aucun envoi sélectionné.</p>
          </article>
        </div>
      </section>
    </section>
  </main>
  <script src="/modern-admin.js?v=20260716-mailbox-flow"></script>
</body>
</html>

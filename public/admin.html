<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord</title>
  <link rel="stylesheet" href="/modern.css?v=20260618-upload-admin">
</head>
<body data-page="admin">
  <main class="admin-page">
    <header class="simple-admin-header">
      <div>
        <p>Administration</p>
        <h1>Tableau de bord</h1>
      </div>
      <button id="refresh-admin" type="button">Actualiser</button>
    </header>

    <section class="counter-grid">
      <article class="counter-card">
        <span>N&B</span>
        <strong id="metric-bw">0</strong>
        <p id="metric-bw-rate">0%</p>
      </article>
      <article class="counter-card color-card">
        <span>Couleur</span>
        <strong id="metric-color">0</strong>
        <p id="metric-color-rate">0%</p>
      </article>
      <article class="counter-card">
        <span>Total copies</span>
        <strong id="metric-total">0</strong>
        <p id="metric-jobs">0 dossier</p>
      </article>
      <article class="counter-card">
        <span>Postes</span>
        <strong id="metric-stations">2</strong>
        <p>Poste 1 / Poste 2</p>
      </article>
    </section>

    <section class="admin-simple-panel">
      <div class="panel-heading">
        <h2>Postes d'impression</h2>
      </div>
      <div class="simple-stations" id="station-grid"></div>
    </section>

    <section class="admin-simple-panel">
      <div class="panel-heading">
        <h2>Derniers dossiers</h2>
      </div>
      <div class="simple-table">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Client</th>
              <th>Poste</th>
              <th>N&B</th>
              <th>Couleur</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="client-table"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/modern-admin.js?v=20260618-upload-admin"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codes clients - Bureau Vallee</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand-header brand-header-row">
      <img src="/logo-bureau-vallee-2021.png" alt="Bureau Vallee">
      <a class="text-link" href="/">Retour impression</a>
    </header>

    <div class="notice-banner hidden" id="notice-banner"></div>

    <section class="panel">
      <div class="panel-heading panel-heading-row">
        <div>
          <p class="eyebrow">Suivi caisse</p>
          <h1 class="page-title">Codes clients</h1>
          <p class="lead">Retrouvez les codes actifs et le nombre de pages N&B ou couleur.</p>
        </div>
        <button id="refresh-codes" type="button">Actualiser</button>
      </div>
      <p class="message" id="codes-message"></p>
      <div class="codes-list" id="codes-list"></div>
    </section>
  </main>
  <script src="/notice.js"></script>
  <script src="/codes.js"></script>
</body>
</html>

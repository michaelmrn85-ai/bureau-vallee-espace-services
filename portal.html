<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bureau Vallee - Espace Services</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="./logo-bureau-vallee-2021.png" alt="Bureau Vallee">
        <div>
          <p class="eyebrow">Montaigu-Vendee</p>
          <h1>Espace Services</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="status-pill">Site permanent</div>
      </div>
    </header>

    <main class="portal-stage">
      <section class="portal-hero">
        <p class="eyebrow">Bureau Vallee</p>
        <h2>Espace Services</h2>
      </section>

      <section class="module-grid portal-module-grid">
        <a class="module-card module-card-admin" href="/admin">
          <span>01</span>
          <strong>Admin base</strong>
          <small>Postes, reglages, compteurs et detail caisse.</small>
        </a>
        <a class="module-card" href="/sessions">
          <span>02</span>
          <strong>Sessions d'impression</strong>
          <small>Interface client pour les postes copieurs.</small>
        </a>
        <a class="module-card module-card-upload" href="/upload">
          <span>03</span>
          <strong>Upload mobile</strong>
          <small>Depot des fichiers depuis telephone avec code de retrait.</small>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
